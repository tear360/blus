name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex: v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decrypt signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun secret KEYSTORE_BASE64 : APK release non signé."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > blus-release.jks
          {
            echo "enabled=true"
            echo "storeFile=blus-release.jks"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEYSTORE_PASSWORD"

      - name: Write signing properties
        if: steps.keystore.outputs.enabled == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=blus-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> signing.properties

      - name: Stamp version from tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          V="${TAG#v}"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Building $V"

      - name: Build release APK
        env:
          BLUS_KEYSTORE: ${{ steps.keystore.outputs.storeFile }}
          BLUS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BLUS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BLUS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::Aucun APK produit"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la app/build/outputs/apk/release

      - name: Verify signature
        if: steps.keystore.outputs.enabled == 'true'
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "${{ steps.apk.outputs.path }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Blus ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Blus ${{ steps.tag.outputs.tag }}

            Application Android pour suivre le réseau Naolib en temps réel.

            **Installer** : télécharger le fichier `.apk` ci-dessous et l'ouvrir.
            Android demandera d'autoriser l'installation depuis cette source.

            Les mises à jour futures sont proposées directement dans l'application
            (Réglages → Mise à jour).

            ---
            Données : Nantes Métropole (GTFS, GTFS-RT) via
            transport.data.gouv.fr — Licence Ouverte 2.0.
            Carte : © contributeurs OpenStreetMap (ODbL).

      - name: Clean keystore
        if: always()
        run: rm -f blus-release.jks signing.properties